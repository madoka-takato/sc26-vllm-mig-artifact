global:
  scrape_interval: 1s
  evaluation_interval: 30s

scrape_configs:

  - job_name: vllm
    static_configs:
      - targets:
          - host.docker.internal:8001
        labels:
          port: "8001"

      - targets:
          - host.docker.internal:8002
        labels:
          port: "8002"

      - targets:
          - host.docker.internal:8003
        labels:
          port: "8003"

      - targets:
          - host.docker.internal:8004
        labels:
          port: "8004"

      - targets:
          - host.docker.internal:8005
        labels:
          port: "8005"

      - targets:
          - host.docker.internal:8006
        labels:
          port: "8006"

      - targets:
          - host.docker.internal:8007
        labels:
          port: "8007"

  - job_name: dcgm-exporter
    static_configs:
      - targets:
          - dcgm-exporter:9401
